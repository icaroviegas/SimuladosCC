<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulado Front 1</title>
  <style>

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #020617;
      --card-bg: #0f172a;
      --card-border: #1e293b;
      --card-inner: #020617;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-subtle: #cbd5e1;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --emerald: #10b981;
      --emerald-hover: #059669;
      --emerald-light: #6ee7b7;
      --emerald-bg: rgba(16, 185, 129, 0.15);
      --emerald-ring: rgba(52, 211, 153, 0.5);
      --rose: #f43f5e;
      --rose-light: #fda4af;
      --rose-bg: rgba(244, 63, 94, 0.15);
      --rose-ring: rgba(251, 113, 133, 0.5);
      --font-sans: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: var(--font-sans);
      min-height: 100vh;
      line-height: 1.5;
      padding: 16px;
      -webkit-font-smoothing: antialiased;
    }

    @media (min-width: 768px) {
      body {
        padding: 32px;
      }
    }

    .container {
      max-width: 896px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .container-wide {
      max-width: 1024px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    header {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .header-top {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    @media (min-width: 768px) {
      .header-top {
        flex-direction: row;
        align-items: flex-end;
        justify-content: space-between;
      }
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 16px;
      border-radius: 9999px;
      font-size: 0.875rem;
      background-color: rgba(99, 102, 241, 0.15);
      color: #c7d2fe;
      border: 1px solid rgba(129, 140, 248, 0.3);
      width: fit-content;
    }

    h1 {
      font-size: 2rem;
      font-weight: 900;
      letter-spacing: -0.025em;
      margin-top: 12px;
      color: #ffffff;
    }

    @media (min-width: 768px) {
      h1 {
        font-size: 2.75rem;
      }
    }

    .subtitle {
      color: var(--text-muted);
      margin-top: 6px;
      font-size: 0.95rem;
    }

    .score-card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 14px 20px;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
      min-width: 150px;
    }

    .score-card-label {
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    .score-card-val {
      font-size: 1.5rem;
      font-weight: 700;
      color: #ffffff;
      margin-top: 2px;
    }

    .progress-track {
      height: 12px;
      border-radius: 9999px;
      background-color: #1e293b;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      border-radius: 9999px;
      background: linear-gradient(to right, #6366f1, #d946ef);
      transition: width 0.3s ease;
    }

    .progress-text {
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    .panel {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 20px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    @media (min-width: 768px) {
      .panel {
        padding: 32px;
      }
    }

    .question-header {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    @media (min-width: 768px) {
      .question-header {
        flex-direction: row;
        align-items: flex-start;
        justify-content: space-between;
      }
    }

    .topic-tag {
      font-size: 0.875rem;
      font-weight: 600;
      color: #a5b4fc;
    }

    .question-text {
      font-size: 1.35rem;
      font-weight: 700;
      line-height: 1.35;
      color: #ffffff;
      margin-top: 6px;
    }

    @media (min-width: 768px) {
      .question-text {
        font-size: 1.65rem;
      }
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 0.875rem;
      font-weight: 600;
      width: fit-content;
      white-space: nowrap;
    }

    .status-badge.ok {
      background-color: var(--emerald-bg);
      color: var(--emerald-light);
      border: 1px solid var(--emerald-ring);
    }

    .status-badge.bad {
      background-color: var(--rose-bg);
      color: var(--rose-light);
      border: 1px solid var(--rose-ring);
    }

    pre.code-block {
      background-color: var(--card-inner);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 16px;
      overflow-x: auto;
      font-family: var(--font-mono);
      font-size: 0.925rem;
      color: #e2e8f0;
      margin-top: 20px;
      line-height: 1.5;
    }

    .options-grid {
      display: grid;
      gap: 12px;
      margin-top: 24px;
    }

    .option-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      width: 100%;
      text-align: left;
      padding: 16px;
      border-radius: 16px;
      background-color: var(--card-inner);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      font-size: 1rem;
      font-family: var(--font-sans);
      cursor: pointer;
      transition: all 0.18s ease;
      user-select: none;
    }

    .option-btn:hover:not(.locked) {
      background-color: #1e293b;
      border-color: #334155;
    }

    .option-btn.selected:not(.locked) {
      background-color: rgba(99, 102, 241, 0.15);
      border-color: #818cf8;
      box-shadow: 0 0 0 1px #818cf8;
    }

    .option-btn.correct {
      background-color: var(--emerald-bg) !important;
      border-color: #34d399 !important;
      box-shadow: 0 0 0 1px #34d399 !important;
    }

    .option-btn.wrong {
      background-color: var(--rose-bg) !important;
      border-color: #fb7185 !important;
      box-shadow: 0 0 0 1px #fb7185 !important;
    }

    .option-text {
      font-weight: 500;
      white-space: pre-line;
      flex: 1;
    }

    .icon-symbol {
      display: inline-flex;
      width: 24px;
      height: 24px;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 1.15rem;
    }

    .icon-symbol.ok {
      color: var(--emerald-light);
    }

    .icon-symbol.bad {
      color: var(--rose-light);
    }

    .explanation-box {
      background-color: var(--card-inner);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 16px;
      margin-top: 20px;
      animation: fadeIn 0.25s ease-out;
    }

    .explanation-title {
      font-weight: 600;
      color: #ffffff;
      margin-bottom: 4px;
    }

    .explanation-text {
      color: var(--text-subtle);
      font-size: 0.95rem;
    }

    .actions-row {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 24px;
      padding-top: 8px;
    }

    @media (min-width: 640px) {
      .actions-row {
        flex-direction: row;
        justify-content: space-between;
      }
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 24px;
      border-radius: 16px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      border: none;
      font-family: var(--font-sans);
      user-select: none;
    }

    .btn:disabled {
      cursor: not-allowed;
      opacity: 0.4;
    }

    .btn-primary {
      background-color: var(--primary);
      color: #ffffff;
    }

    .btn-primary:hover:not(:disabled) {
      background-color: var(--primary-hover);
    }

    .btn-secondary {
      background-color: #1e293b;
      color: var(--text-main);
    }

    .btn-secondary:hover:not(:disabled) {
      background-color: #334155;
    }

    .btn-emerald {
      background-color: var(--emerald);
      color: #ffffff;
    }

    .btn-emerald:hover:not(:disabled) {
      background-color: var(--emerald-hover);
    }

    .btn-outline {
      background-color: var(--bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
    }

    .btn-outline:hover:not(:disabled) {
      background-color: #1e293b;
    }

    .nav-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 8px;
    }

    @media (min-width: 640px) {
      .nav-grid {
        grid-template-columns: repeat(10, minmax(0, 1fr));
      }
    }

    @media (min-width: 1024px) {
      .nav-grid {
        grid-template-columns: repeat(13, minmax(0, 1fr));
      }
    }

    .nav-pill {
      height: 40px;
      border-radius: 12px;
      font-size: 0.875rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      transition: all 0.15s ease;
      user-select: none;
    }

    .nav-pill:hover {
      background-color: #1e293b;
    }

    .nav-pill.current {
      background-color: rgba(99, 102, 241, 0.3) !important;
      border-color: #a5b4fc !important;
      box-shadow: 0 0 0 1px #a5b4fc;
      color: #ffffff;
    }

    .nav-pill.ok {
      background-color: rgba(16, 185, 129, 0.2);
      border-color: rgba(52, 211, 153, 0.5);
      color: #a7f3d0;
    }

    .nav-pill.bad {
      background-color: rgba(244, 63, 94, 0.2);
      border-color: rgba(251, 113, 133, 0.5);
      color: #fecdd3;
    }

    .trophy-gradient-wrapper {
      border-radius: 24px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6, #d946ef);
      padding: 3px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    .trophy-card {
      background-color: rgba(2, 6, 23, 0.95);
      border-radius: 21px;
      padding: 32px;
      text-align: center;
    }

    @media (min-width: 768px) {
      .trophy-card {
        padding: 48px;
      }
    }

    .trophy-icon {
      width: 64px;
      height: 64px;
      margin: 0 auto;
      background-color: rgba(255, 255, 255, 0.1);
      border-radius: 9999px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.25rem;
    }

    .trophy-score {
      font-size: 3.5rem;
      font-weight: 900;
      color: #ffffff;
      margin-top: 16px;
      line-height: 1;
    }

    @media (min-width: 768px) {
      .trophy-score {
        font-size: 4.5rem;
      }
    }

    .trophy-percent {
      font-size: 1.25rem;
      color: var(--text-subtle);
      margin-top: 8px;
    }

    .trophy-msg {
      font-size: 1.125rem;
      color: #e2e8f0;
      margin-top: 12px;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
    }

    .trophy-actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
      justify-content: center;
      margin-top: 24px;
    }

    @media (min-width: 640px) {
      .trophy-actions {
        flex-direction: row;
      }
    }

    .review-list {
      display: grid;
      gap: 16px;
    }

    .review-item {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 20px;
    }

    @media (min-width: 768px) {
      .review-item {
        padding: 24px;
      }
    }

    .review-meta {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
    }

    .review-details {
      display: grid;
      gap: 8px;
      margin-top: 16px;
      font-size: 0.875rem;
    }

    .text-ok {
      color: var(--emerald-light);
      font-weight: 600;
    }

    .text-bad {
      color: var(--rose-light);
      font-weight: 600;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .keyboard-hint {
      font-size: 0.75rem;
      color: #64748b;
      text-align: center;
      margin-top: 8px;
    }

  </style>
</head>

    function calculateScore(questionList, selected, checked) {
      return questionList.reduce((total, item) => {
        return total + (checked[item.id] && selected[item.id] === item.answer ? 1 : 0);
      }, 0);
    }

    function getResultMessage(percent) {
      if (percent >= 85) return "Excelente! Você está muito bem preparado.";
      if (percent >= 70) return "Bom resultado. Continue praticando.";
      if (percent >= 50) return "Você está evoluindo, mas ainda precisa revisar alguns tópicos.";
      return "Revise os conceitos básicos e tente novamente.";
    }

    function escapeHtml(str) {
      if (typeof str !== 'string') return '';
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    let state = {
      current: 0,
      selected: {},
      checked: {},
      showReview: false
    };

    const storageKey = 'simulado_state_' + btoa(encodeURIComponent(quizConfig.title)).substring(0, 16);
    try {
      const saved = localStorage.getItem(storageKey);
      if (saved) {
        const parsed = JSON.parse(saved);
        if (parsed && typeof parsed.current === 'number') {
          state.current = Math.min(parsed.current, questions.length - 1);
          state.selected = parsed.selected || {};
          state.checked = parsed.checked || {};
          state.showReview = Boolean(parsed.showReview);
        }
      }
    } catch (e) {}

    function persistState() {
      try {
        localStorage.setItem(storageKey, JSON.stringify(state));
      } catch (e) {}
    }

    function choose(index) {
      const q = questions[state.current];
      if (state.checked[q.id]) return;
      state.selected[q.id] = index;
      persistState();
      render();
    }

    function confirmAnswer() {
      const q = questions[state.current];
      const chosen = state.selected[q.id];
      if (chosen === undefined) return;
      state.checked[q.id] = true;
      persistState();
      render();
    }

    function nextQuestion() {
      if (state.current < questions.length - 1) {
        state.current++;
      } else {
        state.showReview = true;
      }
      persistState();
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function prevQuestion() {
      if (state.current > 0) {
        state.current--;
        persistState();
        render();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function jumpToQuestion(index) {
      state.current = index;
      state.showReview = false;
      persistState();
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function resetQuiz() {
      if (Object.keys(state.checked).length > 0) {
        const confirmReset = confirm("Deseja realmente reiniciar o simulado e zerar todas as respostas?");
        if (!confirmReset) return;
      }
      state.current = 0;
      state.selected = {};
      state.checked = {};
      state.showReview = false;
      persistState();
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function render() {
      const app = document.getElementById('app');
      const answeredCount = Object.keys(state.checked).length;
      const score = calculateScore(questions, state.selected, state.checked);
      const percent = questions.length ? Math.round((score / questions.length) * 100) : 0;
      const progress = questions.length ? Math.round((answeredCount / questions.length) * 100) : 0;

      if (state.showReview) {
        const resultMessage = getResultMessage(percent);
        let itemsHtml = '';
        questions.forEach((item, index) => {
          const isDone = state.checked[item.id];
          const isOk = isDone && state.selected[item.id] === item.answer;
          const userAns = state.selected[item.id];
          const userAnsText = userAns !== undefined ? item.options[userAns] : "Não respondida";

          itemsHtml += '<div class="review-item">' +
            '<div class="review-meta">' +
              '<div>' +
                '<p class="topic-tag">Q' + item.id + ' · ' + escapeHtml(item.topic) + '</p>' +
                '<h2 style="margin-top:4px; font-size:1.15rem; font-weight:600; color:#fff;">' + escapeHtml(item.question) + '</h2>' +
              '</div>' +
              '<div>' + (isOk ? '<span class="icon-symbol ok">✓</span>' : '<span class="icon-symbol bad">✕</span>') + '</div>' +
            '</div>' +
            (item.code ? '<pre class="code-block" style="margin-top:12px;"><code>' + escapeHtml(item.code) + '</code></pre>' : '') +
            '<div class="review-details">' +
              '<p>Sua resposta: <span class="' + (isOk ? 'text-ok' : 'text-bad') + '">' + escapeHtml(userAnsText) + '</span></p>' +
              '<p>Resposta correta: <span class="text-ok">' + escapeHtml(item.options[item.answer]) + '</span></p>' +
              '<p style="color:var(--text-muted);">' + escapeHtml(item.explanation) + '</p>' +
            '</div>' +
            '<button class="btn btn-outline" style="margin-top:16px;" onclick="jumpToQuestion(' + index + ')">Ver questão</button>' +
          '</div>';
        });

        app.innerHTML = '<div class="container-wide">' +
          '<div class="trophy-gradient-wrapper">' +
            '<div class="trophy-card">' +
              '<div class="trophy-icon">🏆</div>' +
              '<h1 style="font-size:2rem; margin-top:16px;">Resultado final</h1>' +
              '<p class="trophy-score">' + score + '/' + questions.length + '</p>' +
              '<p class="trophy-percent">Aproveitamento: ' + percent + '%</p>' +
              '<p class="trophy-msg">' + resultMessage + '</p>' +
              '<div class="trophy-actions">' +
                '<button class="btn btn-primary" onclick="resetQuiz()">↻ Refazer simulado</button>' +
                '<button class="btn btn-secondary" onclick="jumpToQuestion(0)">Revisar questões</button>' +
              '</div>' +
            '</div>' +
          '</div>' +
          '<div class="review-list">' + itemsHtml + '</div>' +
        '</div>';
        return;
      }

      const q = questions[state.current] || questions[0];
      const isAnswered = Boolean(state.checked[q.id]);
      const chosen = state.selected[q.id];
      const isCorrect = isAnswered && chosen === q.answer;

      let optionsHtml = '';
      q.options.forEach((opt, idx) => {
        const isSelected = chosen === idx;
        const isRight = isAnswered && idx === q.answer;
        const isWrong = isAnswered && isSelected && idx !== q.answer;

        let optClass = 'option-btn';
        if (isAnswered) optClass += ' locked';
        if (isSelected && !isAnswered) optClass += ' selected';
        if (isRight) optClass += ' correct';
        if (isWrong) optClass += ' wrong';

        let iconHtml = '';
        if (isRight) iconHtml = '<span class="icon-symbol ok">✓</span>';
        else if (isWrong) iconHtml = '<span class="icon-symbol bad">✕</span>';

        const letter = String.fromCharCode(97 + idx);
        optionsHtml += '<button type="button" class="' + optClass + '" onclick="choose(' + idx + ')">' +
          '<span class="option-text">' + letter + ') ' + escapeHtml(opt) + '</span>' +
          iconHtml +
        '</button>';
      });

      let gridHtml = '';
      questions.forEach((item, index) => {
        const done = state.checked[item.id];
        const ok = done && state.selected[item.id] === item.answer;
        const isCurr = index === state.current;

        let pillClass = 'nav-pill';
        if (isCurr) pillClass += ' current';
        if (done && ok) pillClass += ' ok';
        if (done && !ok) pillClass += ' bad';

        gridHtml += '<button type="button" class="' + pillClass + '" onclick="jumpToQuestion(' + index + ')">' + item.id + '</button>';
      });

      app.innerHTML = '<div class="container">' +
        '<header>' +
          '<div class="header-top">' +
            '<div>' +
              '<div class="badge"><span>' + escapeHtml(quizConfig.badge) + '</span></div>' +
              '<h1>' + escapeHtml(quizConfig.title) + '</h1>' +
              '<p class="subtitle">' + escapeHtml(quizConfig.subtitle) + '</p>' +
            '</div>' +
            '<div class="score-card">' +
              '<p class="score-card-label">Pontuação atual</p>' +
              '<p class="score-card-val">' + score + '/' + (answeredCount || 0) + '</p>' +
            '</div>' +
          '</div>' +
          '<div class="progress-track">' +
            '<div class="progress-fill" style="width: ' + progress + '%;"></div>' +
          '</div>' +
          '<p class="progress-text">Respondidas: ' + answeredCount + '/' + questions.length + ' (' + progress + '%)</p>' +
        '</header>' +
        '<div class="panel">' +
          '<div class="question-header">' +
            '<div>' +
              '<p class="topic-tag">Q' + q.id + ' de ' + questions.length + ' · ' + escapeHtml(q.topic) + '</p>' +
              '<h2 class="question-text">' + escapeHtml(q.question) + '</h2>' +
            '</div>' +
            (isAnswered
              ? (isCorrect
                  ? '<div class="status-badge ok"><span class="icon-symbol ok">✓</span> Acertou</div>'
                  : '<div class="status-badge bad"><span class="icon-symbol bad">✕</span> Errou</div>')
              : '') +
          '</div>' +
          (q.code ? '<pre class="code-block"><code>' + escapeHtml(q.code) + '</code></pre>' : '') +
          '<div class="options-grid">' + optionsHtml + '</div>' +
          (isAnswered
            ? '<div class="explanation-box">' +
                '<p class="explanation-title">Explicação</p>' +
                '<p class="explanation-text">' + escapeHtml(q.explanation) + '</p>' +
              '</div>'
            : '') +
          '<div class="actions-row">' +
            '<button type="button" class="btn btn-secondary" onclick="prevQuestion()"' + (state.current === 0 ? ' disabled' : '') + '>← Anterior</button>' +
            (!isAnswered
              ? '<button type="button" class="btn btn-primary" onclick="confirmAnswer()"' + (chosen === undefined ? ' disabled' : '') + '>Confirmar resposta</button>'
              : '<button type="button" class="btn btn-primary" onclick="nextQuestion()">' + (state.current === questions.length - 1 ? 'Ver resultado final' : 'Próxima') + ' →</button>') +
          '</div>' +
          '<div class="keyboard-hint">Atalhos: Teclas 1 a 4 ou A a D para selecionar • Enter para confirmar/avançar • Setas ← → para navegar</div>' +
        '</div>' +
        '<div class="nav-grid">' + gridHtml + '</div>' +
      '</div>';
    }

    window.addEventListener('keydown', (e) => {
      if (state.showReview) return;
      const q = questions[state.current];
      if (!q) return;
      const isAnswered = Boolean(state.checked[q.id]);

      if (!isAnswered) {
        if (['1', 'a', 'A'].includes(e.key)) choose(0);
        else if (['2', 'b', 'B'].includes(e.key)) choose(1);
        else if (['3', 'c', 'C'].includes(e.key)) choose(2);
        else if (['4', 'd', 'D'].includes(e.key)) choose(3);
        else if (e.key === 'Enter') confirmAnswer();
      } else {
        if (e.key === 'Enter') nextQuestion();
      }

      if (e.key === 'ArrowLeft') prevQuestion();
      else if (e.key === 'ArrowRight' && isAnswered) nextQuestion();
    });

    render();

  </script>
</body>
</html>
